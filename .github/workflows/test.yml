name: Run Tests

on:
  push:
    branches: [main, develop, tests]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    # Auf Job-Ebene, damit der Wert in der `if`-Bedingung des Sonar-Steps
    # sichtbar ist (step-eigenes env steht dort noch nicht zur Verfügung).
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis

      - name: Setup Node.js 24.x
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

      # Dependabot- und Fork-PRs erhalten keine Repo-Secrets, SONAR_TOKEN ist
      # dort leer. Der Scanner bricht dann mit "Not authorized or project not
      # found" ab und färbt die CI rot, obwohl Lint, Tests und Build grün sind.
      # Der Scan läuft nach dem Merge auf main ohnehin über denselben Workflow.
      #
      # Geprüft wird das Secret selbst, nicht der Actor: bei einem manuellen
      # Re-Run ist github.actor der auslösende Mensch und nicht dependabot[bot],
      # ein Actor-Vergleich greift dort also nicht.
      - name: SonarCloud Scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
