services:
  essencium-frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '8080:8080'
    environment:
      # Backend API URL
      - VITE_API_URL=http://localhost:8098
      # Frontend URL (für OAuth Redirects)
      - VITE_FRONTEND_URL=http://localhost:8080
      # Schnell-Login mit den Backend-Default-Credentials einblenden (true/false)
      - VITE_SHOW_DEV_LOGIN=true
    restart: unless-stopped
